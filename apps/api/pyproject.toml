[project]
name = "roadmaps-api"
version = "0.0.0"
requires-python = "==3.15.*"
dependencies = [
  "alembic>=1.20",
  "fastapi>=0.163.2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2",
  "opentelemetry-sdk>=1.45.2",
  "psycopg[binary]>=3.3.9",
  "pydantic>=2.14",
  "sqlalchemy>=2.1.9",
  "uvicorn>=0.54",
]

[dependency-groups]
dev = [
  "coverage>=7.10",
  "faker>=40.54.0",
  "httpx2>=2.16",
  "import-linter>=2.17",
  "pytest>=9.2",
  "pytest-xdist>=3.8",
  # Exact: a bump can change their rules, so each is a deliberate change with its fixes
  # (ADR-017 Tooling).
  "ruff==0.17.5",
  "ty==0.0.105",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Compatible uv 0.13 line: setup-uv in CI reads it here, and a range lets Dependabot's
# own uv lock updates without failing on an exact-version mismatch (DEF-039).
required-version = ">=0.13.4,<0.14"
# A release younger than a week is never resolved, as pnpm's minimumReleaseAge holds
# back the workspace's (pnpm-workspace.yaml), so a compromised one is usually found and
# pulled first.
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["src", "."]

[tool.ruff.lint]
select = ["ALL"]
# A name a package keeps private is no API: it changes without notice (PLC2701). The rule
# is in Ruff's preview. `explicit-preview-rules` keeps `ALL` from selecting any other
# preview rule, though `preview` also turns on stable rules' preview behaviour. Without
# `preview` Ruff only warns that PLC2701 does nothing (apps/api/tests/test_ruff_config.py).
# Added 2026-11-28: lint passed an import of one of FastAPI's private names, which review
# had to catch (PR #344). Review by 2027-02-26.
preview = true
explicit-preview-rules = true
extend-select = ["PLC2701"]
# Each rule left out, with its reason (ADR-017 Tooling):
ignore = [
  "COM812", # trailing commas are the formatter's, which this rule fights
  "CPY001", # no copyright header: the licence is the repository's
  "D1",     # a docstring only where it says what the code does not
  "D203",   # conflicts with D211: no blank line before a class docstring
  "D213",   # conflicts with D212: a docstring's summary starts on its first line
  "D401",   # a docstring may say what a thing is, not only command
  "TC00",   # imports stay eager: FastAPI reads annotations at run time, and moving
  #           them into TYPE_CHECKING blocks or lazy imports would hide from it what
  #           it needs, for no gain at start-up
]

[tool.ruff.lint.per-file-ignores]
# Alembic loads each revision by its path, never as a module of a package.
"src/roadmaps_api/migrations/versions/*" = ["INP001"]
"tests/**" = [
  "S101",    # pytest asserts with assert
  "PLR2004", # a test's expected numbers are its subject
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi.HTTPException".msg = "Raise roadmaps_api.errors.ApiError, whose code the envelope carries (ADR-017 Errors)."
"fastapi.exceptions.HTTPException".msg = "Raise roadmaps_api.errors.ApiError, whose code the envelope carries (ADR-017 Errors)."
"starlette.exceptions.HTTPException".msg = "Raise roadmaps_api.errors.ApiError, whose code the envelope carries (ADR-017 Errors)."

[tool.ty.terminal]
error-on-warning = true

[tool.importlinter]
root_package = "roadmaps_api"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "A route calls a service, services/authz call repositories, never upwards (ADR-017 Layering)"
type = "layers"
layers = [
  "roadmaps_api.app",
  "roadmaps_api.routes",
  "roadmaps_api.services",
  "roadmaps_api.authz",
  "roadmaps_api.repositories",
]

[[tool.importlinter.contracts]]
name = "The runtime package never imports dev-only faker or tools (STY-093 S5)"
type = "forbidden"
source_modules = ["roadmaps_api"]
forbidden_modules = ["faker", "tools"]

[tool.alembic]
# For Alembic's own command line, run from apps/api to draft a revision by autogenerate
# (`uv run --locked alembic revision --autogenerate --rev-id NNNN_<slug> -m "<slug>"`,
# with ROADMAPS_MIGRATION_DATABASE_URL set), which is then finished by hand.
# `roadmaps_api.migrate`, which applies them, finds the revisions from the package.
script_location = "%(here)s/src/roadmaps_api/migrations"
# The revision ID is the file's name, `0001_<slug>`.
file_template = "%%(rev)s"

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
# As many workers as the machine has cores, at most four, each on its own database
# (tests/integration/AGENTS.md).
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
  "--numprocesses=auto",
  "--maxprocesses=4",
]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["src/roadmaps_api", "tools"]
# The server test runs the API in a subprocess, as pnpm api:dev does.
patch = ["subprocess"]
parallel = true
sigterm = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
